name: Installer la version 3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remplacer le projet par le contenu du ZIP
        run: |
          set -euo pipefail
          test -f coloc_app_v3.zip || { echo "coloc_app_v3.zip introuvable à la racine"; exit 1; }
          rm -rf /tmp/v3 && mkdir /tmp/v3
          unzip -q coloc_app_v3.zip -d /tmp/v3
          test -f /tmp/v3/package.json || { echo "package.json absent du ZIP"; exit 1; }
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/v3/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Version 3 : portage de la v2 dans Next.js"
          git push
